name: Python tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,tui]"
      - name: Compile package
        run: python -m compileall -q tiny_harness tests
      - name: Run tests
        run: python -m pytest -q tests --ignore=tests/test_integration.py

  sandbox-smoke:
    name: Linux bubblewrap probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sandbox test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux
          python -m pip install -e ".[dev]"
      - name: Check actual kernel namespace support and run isolation tests
        run: |
          python -m pytest -q tests/test_shell_bwrap.py tests/test_sandbox_resource_limits.py -rs
